name: Strategy feature verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      CTS_BUILD_NODE_HEAP_MB: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:strategy-features
      - run: npm run build
      - name: Isolated browser settings and save/reload
        run: CTS_CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser
