name: Independent CTS-C verification
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ctsc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
        env:
          CTS_UI_OUTPUT: artifacts/ui
      - name: Verify complete 50-symbol report and filters
        run: |
          gzip -dc research-data/ctsc-50-summary-20261111.json.gz > "$RUNNER_TEMP/ctsc-summary.json"
          python3 scripts/render-simulation-report.py --input "$RUNNER_TEMP/ctsc-summary.json" --output artifacts/ui/CTS-C-50-symbol-results-20261111.html --commit 1e59722bc2cc1b73f378f2642f0f300b60db21fc
          node scripts/report-smoke.mjs artifacts/ui/CTS-C-50-symbol-results-20261111.html "$RUNNER_TEMP/ctsc-summary.json"
        env:
          CTS_UI_OUTPUT: artifacts/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cts-c-ui-fixtures
          path: artifacts/ui
          if-no-files-found: ignore
      - run: python3 -m unittest discover -s integrations/research -p 'test_contract.py' -v
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: docker build -t cts-c:verified .
      - run: node scripts/docker-smoke.mjs
